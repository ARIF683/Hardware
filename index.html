<style>

button,input,select,textarea{font:inherit;color:var(--tx)}button{cursor:pointer;background:none;border:0}

.chips{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}

.chip.on{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.sp{flex:1}.srt{font-size:24px;color:var(--mut);padding:4px 8px}
.it{display:flex;gap:14px;align-items:flex-start;padding:14px 0}

.q.neg{color:var(--bad)}.q small{font-size:12px;color:var(--mut);font-weight:400;display:block}

.head{display:flex;gap:16px;padding:16px;align-items:flex-start}.head .th{width:84px;height:84px}.head b{font-size:20px}

.bb,.sb{position:fixed;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);z-index:7}

.bq{font-size:30px;font-weight:700;color:var(--ac)}.bq small{font-size:14px;color:var(--mut);font-weight:400}
.bl{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--card);border-radius:12px;padding:12px}

dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--tx);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px}

textarea{width:100%;height:110px;margin-top:12px;background:var(--card);color:var(--tx);border:0;border-radius:10px;padding:10px;font-size:12px}
input.pk{cursor:pointer;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7280' stroke-width='2'/></svg>") no-repeat right 14px center!important}

<script>
const $=id=>document.getElementById(id);
const K='hw_stock_v3';
const K_QUEUE='hw_stock_queue_v1';
const SB_URL='https://xkjvcufajsyqbzjjllma.supabase.co';
const SB_KEY='sb_publishable_sXokssWnrTPWROtmfHjoWA_LRqVPt8V';
const UNITS=['pcs','kg','g','L','ml','box','pack','bag','m','ft','cm','set','pair','dozen','roll','sheet'];
let items=[],hist=[],queue=[];
let sbStat='Connecting…',sbWarn=false;
let rtChannel=null,rtOk=false,rtDelay=5000;
let lastCrash=null;
try{
const d=JSON.parse(
localStorage.getItem(K) ||
localStorage.getItem('hw_stock_v2') ||
localStorage.getItem('hw_stock_v1') ||
'null'
);
if(Array.isArray(d))items=d;
else if(d){items=d.items||[];hist=d.hist||[]}
}catch(e){}
try{queue=JSON.parse(localStorage.getItem(K_QUEUE)||'[]')}catch(e){queue=[]}
queue.forEach(q=>{q.id=q.id||uid0()});function uid0(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
items.forEach((i,k)=>{
i.type=i.type||i.cat||'';i.brand=i.brand||'';i.size=i.size||'';i.barcode=i.barcode||'';
i.code=i.code||'';i.mrp=i.mrp??'';i.unit=i.unit||'pcs';i.aliases=i.aliases||'';
if(i.o==null)i.o=k;i.qty=+i.qty||0;i.cost=+i.cost||0;i.price=+i.price||0;i.low=+i.low||0;
if(!i.updated_at)i.updated_at=new Date().toISOString();
});
const persist=()=>{
try{localStorage.setItem(K,JSON.stringify({items,hist}))}catch(e){}
try{localStorage.setItem(K_QUEUE,JSON.stringify(queue))}catch(e){}
};
const sbHeaders=extra=>({apikey:SB_KEY,'Content-Type':'application/json',...extra});
let flushing=false;
function enqueue(op){queue.push({...op,id:uid(),ts:Date.now()});persist();flush()}
async function runOp(op){
const chk=async r=>{if(!r.ok)throw new Error((await r.text()).slice(0,200))},U=SB_URL+'/rest/v1/';
if(op.type==='upsert'){for(let k=0;k<op.rows.length;k+=300)await chk(await fetch(U+'items?on_conflict=id',{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(op.rows.slice(k,k+300).map(toDB))}))}
else if(op.type==='patch'){for(const {id,patch} of op.rows)await chk(await fetch(U+'items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify(patch)}))}
else if(op.type==='delete'){for(let k=0;k<op.ids.length;k+=80)await chk(await fetch(U+'items?id=in.('+op.ids.slice(k,k+80).join(',')+')',{method:'DELETE',headers:sbHeaders()}))}
else if(op.type==='deleteAll')await chk(await fetch(U+'items?id=not.is.null',{method:'DELETE',headers:sbHeaders()}));
else if(op.type==='tx')await chk(await fetch(U+'transactions?on_conflict=client_id',{method:'POST',headers:sbHeaders({Prefer:'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify(op.rows)}));
else if(op.type==='clearTx')await chk(await fetch(U+'transactions?id=not.is.null',{method:'DELETE',headers:sbHeaders()}));
}
async function flush(){
if(flushing||!queue.length)return;
if(!navigator.onLine){setStat('Offline · '+queue.length+' pending');return}
flushing=true;
try{
while(queue.length){const op=queue[0];await runOp(op);queue=queue.filter(q=>q.id!==op.id);persist();setStat('Syncing… '+queue.length+' left')}
sbWarn=false;setStat('Synced ✓');
}catch(e){
console.error(e);
if(!sbWarn){sbWarn=true;toast('Sync failed, will retry. '+(e.message||e))}
setStat('Pending '+queue.length+' · retrying');setTimeout(flush,15000);
}finally{
flushing=false;
if(!isDialogOpen())render();
}
}
function isDialogOpen(){const d=$('sh'),a=document.activeElement;return !!((d&&d.open)||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))}
function setStat(t){
sbStat=t;
const e=$('sbs');if(e)e.textContent=t;
const p=$('pend');if(p){p.textContent=queue.length?queue.length+' pending':'';
p.className='pill '+(queue.length?'warn':'on')}
const r=$('rts');if(r){
r.textContent=rtOk?'Live ✓':'Off';
r.className='pill '+(rtOk?'on':'warn');
}
}
window.addEventListener('online',()=>{setStat('Online');flush()});
window.addEventListener('offline',()=>setStat('Offline'));
function toDB(i){
return {
id:i.id,o:i.o,name:i.name,code:i.code,barcode:i.barcode,
type:i.type,brand:i.brand,size:i.size,aliases:i.aliases||'',
mrp:i.mrp===''||i.mrp==null?null:+i.mrp,
cost:i.cost,price:i.price,qty:i.qty,low:i.low,unit:i.unit||'pcs',
updated_at:i.updated_at||new Date().toISOString()
};
}
function fromDB(r){
return {...r,mrp:r.mrp??'',unit:r.unit||'pcs',aliases:r.aliases||''};
}
async function sbGet(path){
const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:sbHeaders()});
if(!r.ok)throw new Error((await r.text()).slice(0,200));
return r.json();
}
async function dbLoad(){
setStat('Loading…');
try{
let all=[],k=0;
for(;;){
const a=await sbGet('items?select=*&order=o.asc&limit=1000&offset='+k);
all=all.concat(a);if(a.length<1000)break;k+=1000;
}
const th=await sbGet('transactions?select=*&order=created_at.desc&limit=500');
hist=th.map(r=>({
id:r.item_id,t:Date.parse(r.created_at),n:r.item_name,
a:r.action,q:r.qty,b:r.balance,note:r.note,unit:r.unit||''
}));
if(!all.length&&items.length){
ask('Upload to database?',
'The database is empty. Upload the '+items.length+' items saved in this browser?',
'Upload',()=>{enqueue({type:'upsert',rows:items});flush()});
}else{
const pendingIds=new Set(
queue.filter(q=>q.type==='upsert')
.flatMap(q=>q.rows.map(r=>r.id))
);
const localPending=items.filter(i=>pendingIds.has(i.id));
const dbMap=new Map(all.map(fromDB).map(i=>[i.id,i]));
localPending.forEach(i=>dbMap.set(i.id,i));
items=[...dbMap.values()].sort((a,b)=>a.o-b.o);
}
persist();sbWarn=false;setStat('Synced ✓');render();
flush();
startRealtime();
}catch(e){
console.error(e);
const bl=/fetch|network|load failed/i.test(e.message||'');
if(bl)e={message:'this page is blocked from reaching the database. Open the downloaded file in your normal browser (Chrome) instead'};
setStat('Not saved to database ✗ — '+(e.message||e));
if(!sbWarn){sbWarn=true;toast('Database not reachable. Changes are saved in this browser only. Retry from Settings.')}
}
}
function retrySync(){
if(!queue.length){toast('Nothing pending — already in sync.');flush();return}
toast('Retrying '+queue.length+' pending…');
flush();
}
function startRealtime(){
if(rtChannel)return;
const url=SB_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SB_KEY+'&vsn=1.0.0';
let ws;
try{ws=new WebSocket(url)}catch(e){return}
const topic='realtime:public:items';
const joinRef=uid();
const send=m=>ws.readyState===1&&ws.send(JSON.stringify(m));
ws.onopen=()=>{
send({topic,event:'phx_join',
payload:{config:{broadcast:{self:false},presence:{key:''},
postgres_changes:[{event:'*',schema:'public',table:'items'}]}},
ref:joinRef});
ws._hb=setInterval(()=>send({topic:'phoenix',event:'heartbeat',payload:{},ref:uid()}),25000);
};
ws.onmessage=e=>{
let m;try{m=JSON.parse(e.data)}catch(_){return}
if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok'){rtOk=true;rtDelay=5000;if(!isDialogOpen())render()}
if(m.event==='postgres_changes'){
const p=m.payload?.data?.record||m.payload?.record;
const oldRec=m.payload?.data?.old_record||m.payload?.old_record;
const type=m.payload?.data?.type||m.payload?.type;
if(!p&&!oldRec)return;
if(S.edit&&(p?.id===S.edit||oldRec?.id===S.edit))return;
const targetId=p?.id||oldRec?.id;
const hasPending=queue.some(q=>{
if(q.type==='upsert')return q.rows.some(r=>r.id===targetId);
if(q.type==='patch')return q.rows.some(r=>r.id===targetId);
if(q.type==='delete')return q.ids.includes(targetId);
return false;
});
if(hasPending)return;
if(type==='INSERT'||type==='UPDATE'){
const incoming=fromDB(p);
const idx=items.findIndex(x=>x.id===incoming.id);
if(idx>=0){
const local=items[idx];
const localTs=Date.parse(local.updated_at||0)||0;
const incTs=Date.parse(incoming.updated_at||0)||0;
items[idx]=incTs>=localTs?{...local,...incoming}:{...incoming,...local};
}else{
items.push(incoming);
}
items.sort((a,b)=>a.o-b.o);
persist();
if(!isDialogOpen())render();
}else if(type==='DELETE'){
const id=p?.id||oldRec?.id;
if(id){items=items.filter(x=>x.id!==id);persist();if(!isDialogOpen())render()}
}
}
};
ws.onclose=()=>{clearInterval(ws._hb);rtOk=false;rtChannel=null;setStat(sbStat);setTimeout(startRealtime,rtDelay);rtDelay=Math.min(rtDelay*2,60000)};
ws.onerror=()=>{};
rtChannel=ws;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const uuid=()=>{
if(crypto&&crypto.randomUUID)return crypto.randomUUID();
return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
const r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);
});
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const lo=i=>i.qty<0||(i.low>0&&i.qty<=i.low);
const uShort=u=>u==='pcs'?'':u;
const S={tab:'items',grp:null,item:null,sel:null,q:'',gb:'none',ins:false,sort:'o',gks:[]};
const GB=[['none','None'],['name','Name'],['cost','Cost'],['price','Price'],['type','Type'],['brand','Brand'],['size','Size'],['mrp','Mrp'],['unit','Unit']];
const cmp={
o:(x,y)=>x.o-y.o,
n:(x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}),
nz:(x,y)=>y.name.localeCompare(x.name,undefined,{numeric:true}),
q:(x,y)=>y.qty-x.qty,
c:(x,y)=>y.cost-x.cost
};
const gk=i=>String(i[S.gb]??'')||'—';
const cp=t=>String(t??'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
const hay=i=>[i.name,i.size,i.brand,i.type,i.code,i.barcode,i.mrp,i.unit,i.aliases].join(' ').toLowerCase();
const flt=()=>{
const qs=S.q.trim().toLowerCase(),qc=cp(qs),tk=qs.split(/\s+/).filter(Boolean);
const l=items.filter(i=>(!S.ins||i.qty>0)&&(S.grp==null||gk(i)===S.grp)).sort(cmp[S.sort]);
if(!qc)return l;
const sc=new Map();
l.forEach(i=>{const h=hay(i);sc.set(i.id,cp(i.name).includes(qc)?3:cp(h).includes(qc)?2:tk.every(t=>h.includes(t))?1:0)});
const top=l.some(i=>sc.get(i.id)>=2)?2:1;
return l.filter(i=>sc.get(i.id)>=top).sort((a,b)=>sc.get(b.id)-sc.get(a.id));
};
function render(){
try{
let h;
if(S.item)h=detail();
else h={home,items:itemsScr,tx:txScr,set:setScr}[S.tab]();
$('app').innerHTML=h;
$('nav').style.display=S.item?'none':'';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
setStat(sbStat);
}catch(e){
console.error('Render crashed:',e);
lastCrash=e;
$('app').innerHTML=crashScreen(e);
$('nav').style.display='none';
}
}
function crashScreen(e){
return `<div class="crash">
<h2>Something went wrong</h2>
<p class="note">The app hit an error while rendering. You can reload, or copy the error below.</p>
<pre>${esc((e&&e.message)||String(e))}</pre>
<div class="ac" style="justify-content:center">
<button class="b2" onclick="location.reload()">Reload app</button>
<button class="b1" onclick="clearLocalAndReload()">Reset local data</button>
</div>
<p class="note" style="margin-top:16px">Reset clears this browser's copy only. Data in the database is untouched.</p>
</div>`;
}
function clearLocalAndReload(){
if(!confirm('Clear this browser\'s local data and reload? Database data stays.'))return;
try{localStorage.removeItem(K);localStorage.removeItem(K_QUEUE)}catch(e){}
location.reload();
}
const go=t=>{S.tab=t;S.item=null;S.grp=null;S.sel=null;render();scrollTo(0,0)};

function tapI(id){

}

async function load(f){
if(!f)return;
try{
const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(c=>c!==''));
const h=rows[0].map(String),used=new Set();
$('map').innerHTML=`<p class="note">${rows.length-1} rows found. Check which column matches each field:</p>`+
F.map(([k,l,re])=>{
const g=h.findIndex((x,i)=>!used.has(i)&&re.test(x));
if(g>-1)used.add(g);
return `<label>${l}<select id="m_${k}"><option value="-1">— skip —</option>${
h.map((x,i)=>`<option value="${i}" ${i==g?'selected':''}>${esc(x||'Column '+(i+1))}</option>`).join('')
}</select></label>`;
}).join('')+
`<label>If items already exist<select id="mode">
<option value="add">Add to existing items</option>
<option value="rep">Replace all existing items</option>
</select></label>`;
$('goI').style.display='';
}catch(e){toast('Could not read this file.')}
}
async function doImp(){
const g=k=>+$('m_'+k).value,num=v=>parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0,s=(r,k)=>g(k)>-1?String(r[g(k)]).trim():'';
if(g('name')<0)return toast('Please choose the Item name column');
const rep=$('mode').value=='rep';
let o=rep?0:items.reduce((m,x)=>Math.max(m,x.o),-1)+1;
const now=new Date().toISOString();
const out=rows.slice(1).filter(r=>s(r,'name')).map(r=>({
id:uid(),o:o++,name:s(r,'name'),code:s(r,'code'),barcode:s(r,'barcode'),
type:s(r,'type'),brand:s(r,'brand'),size:s(r,'size'),
unit:s(r,'unit')||'pcs',
aliases:s(r,'aliases'),
mrp:s(r,'mrp')===''?'':num(r[g('mrp')]),
qty:g('qty')>-1?num(r[g('qty')]):0,
cost:g('cost')>-1?num(r[g('cost')]):0,
price:g('price')>-1?num(r[g('price')]):0,
low:0,updated_at:now
}));
items=rep?out:items.concat(out);
S.grp=null;S.sel=null;S.sort='o';
persist();closeSh();render();
if(rep)enqueue({type:'deleteAll'});
enqueue({type:'upsert',rows:out});
toast(out.length+' items imported');
}

</script></body></html>
